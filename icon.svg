<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />

  <!-- Brain & Cross Design -->
  <g transform="translate(106, 106)">
    <!-- Central Medical Cross -->
    <rect x="110" y="50" width="80" height="200" rx="20" fill="#ffffff" />
    <rect x="50" y="110" width="200" height="80" rx="20" fill="#ffffff" />

    <!-- Sparkle / Checkmark -->
    <path d="M210 70 L230 110 L270 130 L230 150 L210 190 L190 150 L150 130 L190 110 Z" fill="#38bdf8" />
    <path d="M120 150 L140 170 L180 130" stroke="#0d9488" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
